<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Homeward — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f4efe3;
    --paper: #fbf7ec;
    --surface: #ffffff;
    --ink: #1c1a16;
    --ink-2: #3c3830;
    --muted: #7a7264;
    --line: #e3dccc;
    --line-2: #d4cbb7;
    --accent: #b54a2c;
    --accent-ink: #7a2e18;
    --accent-soft: #f2d9cb;
    --ok: #4a6b4f;
    --ok-soft: #dbe6dc;
    --bad: #a33a3a;
    --bad-soft: #f1d6d6;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 14.5px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  input, select, textarea { font: inherit; color: inherit; }

  /* top bar */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-inner {
    max-width: 1240px; margin: 0 auto;
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--serif);
    font-weight: 500;
    font-size: 24px;
    letter-spacing: -0.02em;
  }
  .brand .mark {
    width: 32px; height: 32px;
    background: var(--accent); color: #fff;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .brand .mark svg { width: 16px; height: 16px; }
  .brand-tag {
    font-family: var(--sans);
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px;
    margin-left: 6px;
  }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .back-link {
    font-size: 13px; font-weight: 500;
    color: var(--ink-2);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-2);
    transition: background .15s, border-color .15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .back-link:hover { background: var(--paper); border-color: var(--ink); }
  .back-link.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* admin tabs */
  .admin-tabs {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 2px;
    margin-bottom: 22px;
  }
  .admin-tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    transition: background .15s, color .15s;
  }
  .admin-tab svg { width: 14px; height: 14px; }
  .admin-tab:hover { color: var(--ink); }
  .admin-tab.active {
    background: var(--ink);
    color: var(--paper);
  }
  .admin-tab.active:hover { color: var(--paper); }

  /* events-specific table cells */
  td.col-banner { width: 96px; }
  .row-banner {
    width: 80px; height: 48px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--line);
    display: block;
  }
  .row-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row-title {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.15;
  }

  /* kind pills */
  .pill.kind-adoption  { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
  .pill.kind-petfair   { background: #e6e0f4; border-color: #8c79c1; color: #4a3a82; }
  .pill.kind-clinic    { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .pill.kind-community { background: #fbe9c8; border-color: #c69a3a; color: #6e4d10; }
  .pill.kind-training  { background: #d8e5ee; border-color: #5b89a8; color: #2d4d68; }
  .pill.kind-other     { background: var(--bg); border-color: var(--line-2); color: var(--ink-2); }
  .pill.featured {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }

  .banner-preview {
    margin-top: 6px;
    height: 110px;
    background: var(--bg);
    border: 1px dashed var(--line-2);
    border-radius: var(--r-md);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 12.5px;
  }
  .banner-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* page header */
  .page {
    max-width: 1240px; margin: 0 auto;
    padding: 36px 32px 80px;
  }
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .page-head h1 {
    font-family: var(--serif); font-weight: 500;
    font-size: 44px; line-height: 1.05;
    letter-spacing: -0.022em;
    margin: 0;
  }
  .page-head h1 em { font-style: italic; color: var(--accent); }
  .page-head p {
    margin: 8px 0 0; color: var(--muted);
    font-size: 14.5px; max-width: 56ch;
  }

  .actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 600;
    transition: background .15s, color .15s, border-color .15s, transform .1s;
    border: 1px solid transparent;
  }
  .btn svg { width: 14px; height: 14px; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--accent); }
  .btn.ghost {
    background: var(--paper);
    border-color: var(--line-2);
    color: var(--ink-2);
  }
  .btn.ghost:hover { border-color: var(--ink); color: var(--ink); }
  .btn.danger {
    background: var(--bad-soft);
    color: var(--bad);
  }
  .btn.danger:hover { background: var(--bad); color: #fff; }
  .btn:active { transform: scale(.98); }

  /* toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 12px 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 10px 14px 10px 40px;
    font-size: 14px;
    outline: none; transition: border-color .15s;
  }
  .search input:focus { border-color: var(--accent); }
  .filter-select {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .filter-select::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 50%;
    width: 8px; height: 8px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: translateY(-70%) rotate(45deg);
    pointer-events: none;
  }
  .filter-select select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 11px 36px 11px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
    min-width: 220px;
    max-width: 280px;
    cursor: pointer;
  }
  .filter-select select:focus { border-color: var(--accent); }
  .filter-select.narrow select {
    min-width: 160px;
    max-width: 180px;
  }
  .stat-chip {
    font-size: 12.5px;
    color: var(--muted);
    background: var(--bg);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }

  /* table */
  .table-wrap {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-weight: 600;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: rgba(0,0,0,.02); }
  td.col-photo { width: 64px; }
  .row-photo {
    width: 48px; height: 48px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--line);
    display: block;
  }
  .row-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row-name {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--ink);
    line-height: 1.1;
  }
  .row-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .pill {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 4px;
  }
  .pill.hdb-yes { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .pill.hdb-no  { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .pill.status-active,
  .pill.status-inactive {
    background: var(--bg);
    border-color: var(--line);
    color: var(--ink-2);
    padding-left: 9px;
  }
  .pill.status-inactive { color: var(--muted); }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 2px var(--ok-soft);
  }
  .pill.status-inactive .status-dot {
    background: #b9b3a7;
    box-shadow: 0 0 0 2px #e7e3da;
  }
  .group-tag {
    display: inline-block;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.25;
    max-width: 220px;
  }
  .row-actions {
    display: flex; gap: 6px; justify-content: flex-end;
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--line);
    transition: background .15s, color .15s, border-color .15s;
  }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .icon-btn.danger:hover { background: var(--bad); border-color: var(--bad); color: #fff; }

  .empty {
    padding: 56px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty h3 {
    font-family: var(--serif); font-weight: 500;
    font-size: 22px; color: var(--ink); margin: 0 0 6px;
  }

  /* dialog */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(28,26,22,.55);
    backdrop-filter: blur(4px);
    z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .dialog {
    width: min(640px, 100%);
    max-height: calc(100vh - 48px);
    background: var(--paper);
    border-radius: var(--r-lg);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 64px -20px rgba(0,0,0,.35);
    animation: slideUp .2s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

  .dialog-head {
    padding: 22px 26px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
  }
  .dialog-head h2 {
    font-family: var(--serif); font-weight: 500;
    font-size: 24px; letter-spacing: -0.015em;
    margin: 0;
  }
  .dialog-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, transform .15s;
  }
  .dialog-close svg { width: 14px; height: 14px; }
  .dialog-close:hover { background: var(--ink); color: var(--paper); transform: rotate(90deg); }

  .dialog-body {
    padding: 22px 26px;
    overflow-y: auto;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .field input,
  .field select,
  .field textarea {
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
    width: 100%;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus { border-color: var(--accent); }
  .field textarea { min-height: 96px; line-height: 1.5; resize: vertical; }

  .seg-input {
    display: grid;
    background: var(--surface);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg-input.cols-2 { grid-template-columns: 1fr 1fr; }
  .seg-input button {
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    border-radius: 999px;
    transition: background .15s, color .15s;
  }
  .seg-input button:hover { color: var(--ink); }
  .seg-input button[aria-pressed="true"] {
    background: var(--ink); color: var(--paper);
  }

  .dialog-foot {
    padding: 16px 26px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 10px;
    background: var(--bg);
  }
  .dialog-foot .right { display: flex; gap: 10px; }

  /* confirm dialog */
  .confirm-text {
    font-size: 14.5px;
    color: var(--ink-2);
    line-height: 1.55;
  }
  .confirm-text b { color: var(--ink); font-weight: 600; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--ink); color: var(--paper);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13.5px; font-weight: 500;
    box-shadow: 0 16px 32px -10px rgba(0,0,0,.4);
    animation: toastIn .2s ease;
    z-index: 100;
    display: inline-flex; align-items: center; gap: 8px;
  }
  @keyframes toastIn { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  .toast svg { width: 14px; height: 14px; color: var(--ok-soft); }

  @media (max-width: 720px) {
    .form-grid { grid-template-columns: 1fr; }
    .page-head h1 { font-size: 32px; }
    td.col-meta { display: none; }
    td.col-birthday { display: none; }
    td.col-group, th.col-group { display: none; }
    td.col-kind, th.col-kind { display: none; }
    td.col-location, th.col-location { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <ellipse cx="6"  cy="10" rx="2"  ry="2.6"/>
          <ellipse cx="10" cy="6.5" rx="2" ry="2.6"/>
          <ellipse cx="14" cy="6.5" rx="2" ry="2.6"/>
          <ellipse cx="18" cy="10" rx="2"  ry="2.6"/>
          <path d="M12 12c-3 0-5.5 2.4-5.5 5 0 1.8 1.3 3 3 3 1 0 1.7-.5 2.5-.5s1.5.5 2.5.5c1.7 0 3-1.2 3-3 0-2.6-2.5-5-5.5-5z"/>
        </svg>
      </span>
      Homeward
      <span class="brand-tag">Admin</span>
    </div>
    <div class="topbar-actions">
      <a class="back-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to site
      </a>
    </div>
  </div>
</div>

<div id="root"></div>
